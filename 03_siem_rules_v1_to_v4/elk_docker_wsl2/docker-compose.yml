version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.12.2}
    container_name: clinic-siem-es
    environment:
      - node.name=es-clinic-node01
      - cluster.name=${CLUSTER_NAME:-hust-clinic-siem-cluster}
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1536m -Xmx1536m}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ./esdata:/usr/share/elasticsearch/data
      - ./jvm.options:/usr/share/elasticsearch/config/jvm.options.d/clinic_custom.options:ro
    ports:
      - "${ES_PORT:-9200}:9200"
    networks:
      - clinic-siem-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.12.2}
    container_name: clinic-siem-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=1024
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - clinic-siem-net

networks:
  clinic-siem-net:
    driver: bridge