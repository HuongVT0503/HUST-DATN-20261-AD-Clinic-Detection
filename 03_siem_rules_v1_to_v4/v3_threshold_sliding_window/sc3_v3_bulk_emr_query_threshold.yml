  Bat khi so su kien 33205 SELECT tren dbo.HoSoBenhAn tu cung mot nguon vuot nguong trong cua so.
  Tach duoc exfil hang loat khoi tra cuu le binh thuong. Van bat nham tac vu backup cuoi ngay (xu ly o V4).
