# Y tuong: Kerberoasting (ca OpSec 0x12 cham) xin NHIEU ve TGS cho CUNG user-SPN trong cua so;
#   HIS hop le xin ve deu dan, it bien thien. Dat nguong theo cap (TargetUserName) trong timespan.
