# ============================================================================
title: "[SC2-V3] Kerberoast qua cua so truot 4769 toi user-SPN (placeholder)"
id: 11111111-0002-4003-a003-000000000022
status: experimental
description: >
  Bat khi so ve TGS (4769) toi cung mot TargetUserName (tai khoan dich vu co SPN) vuot nguong
  trong cua so thoi gian. Bat ca RC4 lan AES vi khong phu thuoc encryption-type. Giam FP so voi V2.
author: "Vu Thuy Huong (20225135 - HUST)"
