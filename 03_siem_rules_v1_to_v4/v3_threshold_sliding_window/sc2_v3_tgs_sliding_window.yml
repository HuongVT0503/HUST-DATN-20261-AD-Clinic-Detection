# PROVENANCE:
#   - Base: sc2_v2 (ke thua SigmaHQ 496a0e47-... Florian Roth).
#   - nguong/cua so: Sigma Correlation spec (event_count) - https://sigmahq.io/docs/meta/correlations.html
