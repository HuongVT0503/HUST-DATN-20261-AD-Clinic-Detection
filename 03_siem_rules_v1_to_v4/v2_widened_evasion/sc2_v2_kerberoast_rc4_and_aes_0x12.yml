title: "[SC2-V2] Phat hien Kerberoasting ca RC4 (0x17) VA AES256 (0x12) - BAN NOI LONG bat OpSec evasion"
id: 11111111-0002-4002-a002-000000000012
status: experimental
description: >
  Phien ban V2 (NOI LONG) cho Kich ban 2. V1 chi loc TicketEncryptionType = 0x17 nen bo lot
  pha 2B (xin ve AES256 0x12). V2 bat CA 0x17 va 0x12 cho moi yeu cau ve TGS (4769), chi loai
  tru tai khoan may ($) va krbtgt. Hau qua co chu dich: moi ve AES256 hop le ma may tram/HIS
  xin hang ngay deu bi bat nham -> bung no FP (base-rate). So that dem sau replay.
# PROVENANCE:
#   - Ke thua selection tu SigmaHQ win_security_susp_rc4_kerberos.yml (id 496a0e47-0a33-4dca-b009-9e6ca3591f39,
#     Florian Roth). V2 mo rong them nhanh 0x12 (do an tu them, khong co trong rule goc).
#   - 0x17 vs 0x12 va ly do evasion: The Hacker Recipes + GhostPack Rubeus (xem PROVENANCE).
author: "Vu Thuy Huong (20225135 - HUST)"
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml
  - https://www.thehacker.recipes/ad/movement/kerberos/kerberoast
date: 2026/11/16
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType:
      - '0x17'   # RC4-HMAC (pha 2A default)
      - '0x12'   # AES256 (pha 2B evasion) <- V2 them dong nay so voi V1
  reduction:
    ServiceName|endswith: '$'
  condition: selection and not reduction
falsepositives:
  - "Moi ve TGS AES256 hop le trong mang (dang nhap HIS, dich vu Windows) - nguon FP chinh cua V2."
level: medium
tags:
  - attack.credential_access
  - attack.t1558.003
