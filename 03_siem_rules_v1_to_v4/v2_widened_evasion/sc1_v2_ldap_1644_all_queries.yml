title: "[SC1-V2] Phat hien moi truy van LDAP ton kem (Event 1644) - BAN NOI LONG de bat ADSI low-and-slow"
id: 11111111-0001-4002-a002-000000000011
status: experimental
description: >
  Phien ban V2 (NOI LONG) cho Kich ban 1. Muc tieu: bat duoc ca pha lan tranh 1B (do quet ADSI
  low-and-slow) ma V1 bo lot, bang cach tu bo phu thuoc chu ky cong cu va BAT MOI Event 1644.
  Day la buoc "co tinh lam rong de khong bo lot" nham CHUNG MINH bung no canh bao gia (base-rate):
  moi truy van LDAP ton kem hop le cua phan mem HIS (SVC_HIS_Sync tra cuu phan quyen bac si) deu
  bi bat nham. So FP that se dem sau khi replay (xem Base_Rate_Fallacy_Axelsson1999.md).
# PROVENANCE:
#   - KHONG phai 1 rule cong bo san. Day la ban "widen" co chu dich cua chinh do an,
#     mo rong tu nen telemetry 1644 (Microsoft - Event 1644 Field Engineering).
#   - Co so ly thuyet vi sao noi long => FP tang rat nhieu: Axelsson 1999 (base-rate fallacy).
author: "Vu Thuy Huong (20225135 - HUST)"
