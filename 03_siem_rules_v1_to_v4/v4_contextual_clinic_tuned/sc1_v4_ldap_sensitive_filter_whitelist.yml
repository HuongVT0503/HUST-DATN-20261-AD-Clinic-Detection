title: "[SC1-V4] Phat hien ADSI Recon qua Event 1644 - Whitelist theo DANH TINH + IP NGUON (khong theo noi dung filter)"
id: 11111111-0001-4004-a004-000000000014
status: experimental
description: >
  Phien ban V4 (toi uu ngu canh phong kham) cho Kich ban 1 (do quet ADSI low-and-slow).
  Bat Event ID 1644 khi truy van LDAP chua thuoc tinh NHAY CAM thuong dung de do quet
  dac quyen (servicePrincipalName, adminCount=1, userAccountControl flag khong yeu cau
  pre-auth, description chua 'Pass'), RỒI loai tru luu luong hop le cua phan mem HIS.

  V4 NEO WHITELIST VAO DANH TINH (SVC_HIS_Sync) + IP NGUON (SRV02)-> ke tan cong tu may tram le tan (WS01) KHONG the gia mao duoc neu chua chiem duoc SRV02.
author: "Vu Thuy Huong (20225135 - HUST)"
references:
  # Event ID 1644 va cach bat (registry 15 Field Engineering): xem keep.md / PROVENANCE
  - https://techcommunity.microsoft.com/t5/core-infrastructure-and-security/how-to-find-expensive-inefficient-and-long-running-ldap-queries/ba-p/257859
  # Nguyen tac Kerckhoffs (whitelist khong duoc dua vao bi mat ke tan cong dieu khien duoc)
  - https://www.thehacker.recipes/ad/movement/kerberos/kerberoast
date: 2026/11/20
logsource:
  product: windows
  service: directory-service   # kenh "Directory Service" tren DC01
detection:
  selection_1644:
    EventID: 1644
  selection_sensitive:
    # Cac thuoc tinh nhay cam ma hanh vi recon hay loc. Day la dau hieu TAN CONG, giu lai.
    # LUU Y: tuy cach Winlogbeat phan tich 1644, cac truong nay co the nam trong 'message'
    # thay vi field rieng. Neu vay, doi sang: message|contains cac chuoi ben duoi.
    SearchFilter|contains:
      - 'servicePrincipalName'
      - 'adminCount=1'
      - '4194304'          # UF_DONT_REQUIRE_PREAUTH (san AS-REP roast)
      - 'description=*Pass'
  filter_his_identity_source:
    # ===== WHITELIST NEO VAO DANH TINH + IP NGUON (KHONG neo vao noi dung filter) =====
    # Chi bo qua khi CA HAI dieu kien dung: tai khoan dich vu HIS VA goi tu IP cua SRV02.
    # Ke tan cong tren WS01 (172.31.10.30) khong thoa man IP = 172.31.10.22 -> van bi bat.
    SubjectUserName: 'SVC_HIS_Sync'
    IpAddress: '172.31.10.22'     # SRV02 = may chay phan mem HIS, nguon truy van hop le
  condition: selection_1644 and selection_sensitive and not filter_his_identity_source
falsepositives:
  - "Quan tri vien IT_Admin chay truy van AD hop le tu may quan tri (them IP may do vao filter neu can)."
level: high
tags:
  - attack.discovery
  - attack.t1087.002
  - attack.t1018
# ============================================================================
# KHOI GHI CHU IP (neu dung lai lab HOAC tune cho phong kham khac):
#   IpAddress = 172.31.10.22 GIA DINH SRV02 duoc GHIM dung Private IP nay luc launch EC2.
#   Cach ghim: AWS_EC2_3VM_DEPLOYMENT_GUIDE.md muc 1.2 (dat "Primary IP" trong Advanced network
#   configuration khi launch tung may). Neu de AWS cap IP ngau nhien, PHAI sua IpAddress o tren
#   + dong source.ip trong kql_queries/elastic_kibana_saved_queries.ndjson (SC1_V4) cho khop IP that.
#
#   PHONG KHAM KHAC (huong dan tune cho IT): thay IpAddress = IP tinh may chu HIS,
#   SubjectUserName = tai khoan dich vu dong bo BHYT. Chay baseline 7 ngay de xac dinh
#   dung 2 gia tri nay (xem Clinic_IT_Morning_Review_Playbook.md, Buoc 0).
#
# DIEU KIEN DUNG WHITELIST: bo sinh nhieu Invoke-HISXmlSync PHAI chay TREN SRV02 duoi SVC_HIS_Sync
#   (dang ky qua Register-ClinicNoiseScheduledTasks.ps1 tren SRV02). Neu chay tren WS01 thi 1644 se
#   ghi IP = WS01 va whitelist nay sai.
#
#   Neu Winlogbeat KHONG phan tich duoc SubjectUserName tu 1644, neo whitelist CHI theo IpAddress =
#   SRV02 (xem muc 8.1 playbook). Neo IP van thoa Kerckhoffs.
# ============================================================================
