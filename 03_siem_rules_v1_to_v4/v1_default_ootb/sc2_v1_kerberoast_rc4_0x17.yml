title: "[SC2-V1] Phat hien Kerberoasting Mac dinh qua Ma hoa RC4-HMAC (0x17)"
id: 11111111-0002-4001-a001-000000000002
status: stable
description: >
  Phien ban V1 (Out-of-the-Box, ke thua tu SigmaHQ win_security_susp_rc4_kerberos.yml -
  "Suspicious Kerberos RC4 Ticket Encryption", id goc 496a0e47-0a33-4dca-b009-9e6ca3591f39):
  Bat Event ID 4769 co TicketOptions 0x40810000 va TicketEncryptionType = 0x17 (RC4-HMAC),
  loai tru tai khoan may (ServiceName ket thuc bang '$').
  Diem mu: Bo lot Kich ban 2B khi ke tan cong xin ve AES256 (0x12).
# SUA so voi ban truoc:
#   1. Ten file nguon dung la win_security_susp_rc4_kerberos.yml, KHONG phai win_security_kerberoasting.yml.
#   2. Logic reduction goc chi loai ServiceName|endswith '$' (dung selection and not reduction),
#      khong AND them krbtgt. Toi bam dung ban goc de V1 doc nhu "giai phap hien co".
author: "Florian Roth (Nextron Systems); tuy bien cho lab phong kham boi Vu Thuy Huong (20225135 - HUST)"
references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_rc4_kerberos.yml
  - https://adsecurity.org/?p=3458
  - https://www.trimarcsecurity.com/post/detecting-kerberoasting-activity
date: 2026/11/15
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketOptions: '0x40810000'
    TicketEncryptionType: '0x17'
  reduction:
    ServiceName|endswith: '$'
  condition: selection and not reduction
falsepositives:
  - "Tai khoan dich vu tren he thong ke thua cu chi ho tro RC4 (vi du NetApp)."
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
