title: "[SC1-V1] Phát hiện Dò quét Active Directory qua Chữ ký SharpHound/SetSPN Mặc định"
id: 11111111-0001-4001-a001-000000000001
status: stable
description: >
  Phiên bản V1 (Out-of-the-Box): Chỉ bắt Sysmon Event ID 1 khi phát hiện tên tiến trình hoặc
  tham số dòng lệnh mặc định của công cụ SharpHound.exe, BloodHound hoặc setspn.exe.
  Điểm mù: Bỏ lọt hoàn toàn Kịch bản 1B (Dò quét chậm qua giao diện .NET ADSI trong bộ nhớ).
author: "Vũ Thúy Hường (20225135 - HUST)"
date: 2026/11/15
logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
    EventID: 1
    CommandLine|contains:
      - 'SharpHound'
      - '--CollectionMethods'
      - '-c All'
      - 'Invoke-BloodHound'
      - 'setspn.exe -Q */*'
  condition: selection_cli
falsepositives:
  - "Rất thấp (chỉ cảnh báo khi quản trị viên chạy trực tiếp setspn -Q */*)."
level: high
tags:
  - attack.discovery
  - attack.t1087.002