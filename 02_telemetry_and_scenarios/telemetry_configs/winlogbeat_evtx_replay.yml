# ==============================================================================
# winlogbeat_evtx_replay.yml
# Nap tinh (Deterministic Replay) cac .evtx vao Elasticsearch single-node (WSL2 Docker).
# Chay: .\winlogbeat.exe -e -c winlogbeat_evtx_replay.yml -E EVTX_FILE="C:\path\to\file.evtx"
# ==============================================================================

winlogbeat.event_logs:
  - name: ${EVTX_FILE}
    no_more_events: stop

setup.ilm.enabled: false
setup.template.name: "winlogbeat-clinic-replay"
setup.template.pattern: "winlogbeat-clinic-replay-*"
setup.template.settings:
  index.number_of_shards: 1

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  index: "winlogbeat-clinic-replay-%{+yyyy.MM.dd}"
  # An danh hoa ngay khi nap: ES chay pipeline 'emr-anonymize' (redact CCCD/BHYT/ten) truoc khi luu,
  # van giu truong ECS cho luat KQL. Tao pipeline truoc (xem log_anonymizer/README.md).
  
  # Bo comment dong duoi khi da PUT pipeline:
  # pipeline: "emr-anonymize"

processors:
  - add_host_metadata: ~   # metadata may WSL2 dang phan tich, khong phai DC/SRV goc
  - add_fields:
      target: clinic_lab
      fields:
        environment: "GOAD-Light-Clinic-Edition"
        domain: "clinic.local"
        compliance_framework: "TT13_2025_BYT_AND_PDPL_91_2025"
