# ==============================================================================
# Tep: 02_telemetry_and_scenarios/telemetry_configs/winlogbeat_evtx_replay.yml
# Mo ta: Cau hinh Winlogbeat nap tinh (Deterministic Replay) cac tep .evtx chuan
#        vao cum Elasticsearch Single-node tren WSL2 Docker.
# Cach chay: .\winlogbeat.exe -e -c winlogbeat_evtx_replay.yml -E EVTX_FILE="C:\path\to\file.evtx"
# ==============================================================================

winlogbeat.event_logs:
  - name: ${EVTX_FILE}
    no_more_events: stop

# Bat buoc khi dat index tuy bien o Winlogbeat 8.x:
setup.ilm.enabled: false
setup.template.name: "winlogbeat-clinic-replay"
setup.template.pattern: "winlogbeat-clinic-replay-*"
setup.template.settings:
  index.number_of_shards: 1

output.elasticsearch:
  hosts: ["http://localhost:9200"]
  index: "winlogbeat-clinic-replay-%{+yyyy.MM.dd}"

processors:
  - add_host_metadata: ~ #nhét metadata của máy WSL2 đang phân tích, không phải DC/SRV gốc
  - add_fields:
      target: clinic_lab
      fields:
        environment: "GOAD-Light-Clinic-Edition"
        domain: "clinic.local"
        compliance_framework: "TT13_2025_BYT_AND_PDPL_91_2025"
